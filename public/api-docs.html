<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接口文档 (Swagger) - 口袋助手</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
  body { margin: 0; }
  .topbar { background: #1a1f36; color: #fff; padding: 10px 20px; font-size: 15px; font-weight: 700; }
  .topbar a { color: #9db4ff; font-size: 13px; font-weight: 400; margin-left: 12px; }
</style>
</head>
<body>
<div class="topbar">口袋助手 · 开放 API 接口文档 <a href="/openapi.yaml">查看原始 OpenAPI 规范</a></div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
<script>
window.addEventListener('load', function () {
  window.ui = SwaggerUIBundle({
    url: '/openapi.yaml',
    dom_id: '#swagger-ui',
    docExpansion: 'none',
    persistAuthorization: true,
    tryItOutEnabled: true
  });
});
</script>
</body>
</html>
