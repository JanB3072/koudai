name = "koudai"
main = "worker/index.js"
compatibility_date = "2025-05-01"
workers_dev = true

# 静态资源：来自 ./public（未匹配的请求回退到 worker 处理路由/接口）
[assets]
directory = "./public"

# D1 数据库绑定（部署前需先创建：wrangler d1 create koudai，并把 database_id 填到下面）
[[d1_databases]]
binding = "DB"
database_name = "koudai"
database_id = "f64ac7f0-e4d3-4cb6-b003-dc82923d0284"

[vars]
NODE_ENV = "production"
# SESSION_SECRET 已通过 wrangler secret put 设置为密钥，不在明文 vars 中

# 定时任务：北京时间 00:00（UTC 16:00）结算前一天的每日最低消费
[triggers]
crons = ["0 16 * * *"]
